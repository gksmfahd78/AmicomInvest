<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1.0,viewport-fit=cover"
    />
    <meta name="theme-color" content="#141316" />
    <title>아미콤 · 스터디 투자실</title>
    <script>
      (function () {
        var theme = "dark";
        try {
          if (localStorage.getItem("study-theme") === "light") theme = "light";
        } catch (e) {}
        document.documentElement.dataset.theme = theme;
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", theme === "light" ? "#f8f6f5" : "#141316");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
